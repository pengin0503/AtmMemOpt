plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Compile-only references against target mods:
    // Use local ATM10 mods directory if -Patm10_mods_dir is supplied and exists;
    // otherwise resolve the pinned 1.21.1 NeoForge versions from Modrinth/CurseMaven.
    def modsDirProp = project.findProperty('atm10_mods_dir')
    def modsDir = (modsDirProp && !modsDirProp.toString().isBlank()) ? new File(modsDirProp.toString()) : null
    if (modsDir != null && modsDir.exists()) {
        compileOnly fileTree(dir: modsDir, includes: [
            'owo-lib-neoforge-*.jar',
            'irons_spellbooks-*.jar',
            'iris-neoforge-*.jar',
            'jei-1.21.1-neoforge-*.jar',
            'jeistuff-*.jar'
        ])
    } else {
        compileOnly('maven.modrinth:owo-lib:wbdHEItB') { transitive = false }
        compileOnly('maven.modrinth:irons-spells-n-spellbooks:Gzh2DpBL') { transitive = false }
        compileOnly('maven.modrinth:iris:KduFYu4t') { transitive = false }
        compileOnly('maven.modrinth:jei:vlNHlgS9') { transitive = false }
        compileOnly('curse.maven:jei-stuff-978621:9260762') { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
